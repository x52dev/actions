[package]
name = "check-workspace-lints"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = [
  "std",
  "serde",
  "parse",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
