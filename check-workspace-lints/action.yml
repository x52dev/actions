name: Check Workspace Lints
description: Checks that local Rust crates inherit workspace lints or define local lints.

inputs:
  working-directory:
    description: Directory containing the workspace Cargo.toml.
    default: "."
    required: false

outputs:
  result:
    description: The check result, either success or failure.
    value: ${{ steps.check.outcome }}

runs:
  using: composite
  steps:
    - name: Check workspace lint configuration
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo run --quiet --locked --manifest-path "${GITHUB_ACTION_PATH}/Cargo.toml" -- "$PWD/Cargo.toml"
